<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>thinkgood 리치 텍스트 에디터</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===== Design Tokens (from DesignTone.md) ===== */
        :root {
            /* Brand */
            --brand-primary: #EC1B1B;
            --brand-primary-hover: #D61818;
            --brand-primary-pressed: #B81515;
            --brand-primary-soft: rgba(236,27,27,0.08);
            --brand-secondary: #111111;

            /* Neutral (warm, red-tinted) */
            --n-0: #FFFFFF;
            --n-50: #FFFCFC;
            --n-100: #F6F2F2;
            --n-200: #E9E2E2;
            --n-300: #D4CECE;
            --n-400: #B5ABAB;
            --n-500: #8C8181;
            --n-700: #5B5252;
            --n-900: #1B1717;

            /* Semantic */
            --state-info: #1C6AE4;
            --state-info-soft: #E7F0FD;

            /* Surface / Role */
            --bg-page: var(--n-50);
            --bg-card: var(--n-0);
            --bg-sunken: var(--n-100);
            --fg-default: var(--n-900);
            --fg-muted: var(--n-500);
            --fg-subtle: var(--n-400);
            --border-default: var(--n-200);
            --border-strong: var(--n-300);
            --border-focus: var(--brand-primary);

            /* Shadows */
            --sh-0: none;
            --sh-1: 0 1px 2px rgba(27,23,23,0.04), 0 1px 1px rgba(27,23,23,0.02);
            --sh-2: 0 4px 12px rgba(27,23,23,0.06), 0 1px 2px rgba(27,23,23,0.04);
            --sh-3: 0 12px 32px rgba(27,23,23,0.10), 0 2px 6px rgba(27,23,23,0.04);
            --sh-focus: 0 0 0 3px rgba(236,27,27,0.30);

            /* Radius */
            --r-xs: 4px;
            --r-sm: 6px;
            --r-md: 8px;
            --r-lg: 12px;
            --r-xl: 16px;

            /* Motion */
            --dur-fast: 120ms;
            --dur-base: 180ms;
            --ease-standard: cubic-bezier(0.2, 0, 0, 1);

            /* Spacing */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;

            /* Typography */
            --font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* ===== Reset & Base ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: var(--font-family);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: var(--bg-page);
            color: var(--fg-default);
        }
        body { display: flex; flex-direction: column; }

        /* ===== Header ===== */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-3) var(--space-4);
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-default);
            flex-shrink: 0;
        }
        .app-header h1 {
            font-size: 20px;
            line-height: 28px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--fg-default);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }
        .char-stats {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            font-size: 13px;
            line-height: 20px;
            font-weight: 500;
            color: var(--fg-muted);
        }
        .char-stats .stat-item {
            display: flex;
            align-items: center;
            gap: var(--space-1);
            white-space: nowrap;
        }
        .char-stats .stat-value {
            color: var(--fg-default);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .char-stats .stat-divider {
            width: 1px;
            height: 12px;
            background: var(--border-default);
        }

        /* ===== Toolbar ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-default);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: var(--border-default);
            margin: 0 var(--space-1);
        }
        .toolbar-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-1);
            height: 36px;
            padding: 0 var(--space-3);
            background: var(--bg-sunken);
            border: 1px solid var(--border-default);
            border-radius: var(--r-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-family);
            color: var(--fg-default);
            transition: all var(--dur-fast) var(--ease-standard);
            user-select: none;
            white-space: nowrap;
        }
        .toolbar-btn:hover {
            background: var(--n-200);
            border-color: var(--border-strong);
        }
        .toolbar-btn.active {
            background: var(--brand-primary);
            color: var(--n-0);
            border-color: var(--brand-primary);
        }
        .toolbar-btn.active:hover {
            background: var(--brand-primary-hover);
        }
        .toolbar-btn i { font-size: 13px; }
        .toolbar-btn .btn-label { font-size: 13px; }

        .toolbar-select {
            height: 36px;
            padding: 0 var(--space-3);
            background: var(--bg-sunken);
            border: 1px solid var(--border-default);
            border-radius: var(--r-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-family);
            color: var(--fg-default);
            transition: border-color var(--dur-fast) var(--ease-standard);
        }
        .toolbar-select:hover { border-color: var(--border-strong); }
        .toolbar-select:focus { outline: none; border-color: var(--border-focus); box-shadow: var(--sh-focus); }

        .font-size-group {
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }
        .font-size-input {
            width: 56px;
            height: 36px;
            padding: 0 var(--space-2);
            border: 1px solid var(--border-default);
            border-radius: var(--r-sm);
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-family);
            text-align: center;
            background: var(--bg-sunken);
            color: var(--fg-default);
            transition: border-color var(--dur-fast) var(--ease-standard);
        }
        .font-size-input:focus { outline: none; border-color: var(--border-focus); box-shadow: var(--sh-focus); background: var(--bg-card); }
        .font-size-unit { font-size: 12px; color: var(--fg-muted); font-weight: 500; }

        .font-size-spinner {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .font-size-spinner-btn {
            width: 20px;
            height: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-default);
            background: var(--bg-sunken);
            cursor: pointer;
            font-size: 8px;
            color: var(--fg-muted);
            transition: background var(--dur-fast);
        }
        .font-size-spinner-btn:hover { background: var(--n-200); color: var(--fg-default); }
        .font-size-spinner-up { border-radius: var(--r-xs) var(--r-xs) 0 0; border-bottom: none; }
        .font-size-spinner-down { border-radius: 0 0 var(--r-xs) var(--r-xs); }

        .color-picker-input {
            width: 36px;
            height: 36px;
            padding: 2px;
            border: 1px solid var(--border-default);
            border-radius: var(--r-sm);
            cursor: pointer;
            background: var(--bg-sunken);
            transition: border-color var(--dur-fast);
        }
        .color-picker-input:hover { border-color: var(--border-strong); }
        .color-picker-input:focus { outline: none; border-color: var(--border-focus); }

        /* ===== Editor Container ===== */
        .editor-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            background: var(--bg-card);
        }
        .editor-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* ===== Editor Area (contenteditable) ===== */
        .editor-area {
            outline: none;
            resize: none;
            min-height: 100%;
            padding: var(--space-6);
            font-size: 16px;
            line-height: 24px;
            font-weight: 400;
            color: var(--fg-default);
        }
        .editor-area:empty::before {
            content: attr(data-placeholder);
            color: var(--fg-subtle);
            pointer-events: none;
        }

        /* Indent levels */
        .editor-area .indent-level-1 { padding-left: 40px !important; }
        .editor-area .indent-level-2 { padding-left: 80px !important; }
        .editor-area .indent-level-3 { padding-left: 120px !important; }
        .editor-area .indent-level-4 { padding-left: 160px !important; }
        .editor-area .indent-level-5 { padding-left: 200px !important; }
        .editor-area .indent-level-6 { padding-left: 240px !important; }

        /* Typography inside editor — aligned to DesignTone.md */
        .editor-area p {
            margin: 0;
            padding: 0;
            font-size: 16px;
            line-height: 24px;
            font-weight: 400;
        }
        .editor-area h1 {
            font-size: 32px;
            line-height: 40px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0;
            padding: var(--space-6) 0 var(--space-2) 0;
            color: var(--fg-default);
        }
        .editor-area h2 {
            font-size: 24px;
            line-height: 32px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 0;
            padding: var(--space-5) 0 var(--space-1) 0;
            color: var(--fg-default);
        }
        .editor-area h3 {
            font-size: 20px;
            line-height: 28px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin: 0;
            padding: var(--space-4) 0 var(--space-1) 0;
            color: var(--fg-default);
        }
        .editor-area ul, .editor-area ol {
            margin: var(--space-2) 0;
            padding-left: var(--space-6);
        }
        .editor-area ul { list-style-type: disc; }
        .editor-area ol { list-style-type: decimal; }
        .editor-area li {
            margin: var(--space-1) 0;
            font-size: 16px;
            line-height: 24px;
        }

        /* Blockquote — brand accent left border, sunken bg */
        .editor-area blockquote {
            margin: var(--space-3) 0;
            padding: var(--space-4) var(--space-5);
            border: none;
            background: var(--bg-sunken);
            border-radius: var(--r-lg);
            color: var(--n-700);
            font-size: 16px;
            line-height: 24px;
            position: relative;
        }

        /* Code block — sunken bg, monospace */
        .editor-area pre {
            margin: var(--space-3) 0;
            padding: var(--space-5);
            padding-top: 44px;
            background: var(--n-900);
            color: var(--n-100);
            border: 1px solid var(--n-700);
            border-radius: var(--r-md);
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 22px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            position: relative;
        }
        .editor-area pre .copy-code-btn {
            position: absolute;
            top: var(--space-2);
            right: var(--space-2);
            background: var(--n-700);
            color: var(--n-200);
            border: none;
            border-radius: var(--r-xs);
            padding: var(--space-1) var(--space-2);
            cursor: pointer;
            font-size: 12px;
            font-family: var(--font-family);
            font-weight: 500;
            transition: background var(--dur-fast);
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }
        .editor-area pre .copy-code-btn:hover { background: var(--n-500); }

        /* Alignment helpers */
        .editor-area [style*="text-align: center"] { text-align: center !important; }
        .editor-area [style*="text-align: right"] { text-align: right !important; }

        /* ===== Mode Textarea (HTML / Markdown) ===== */
        .mode-textarea {
            outline: none;
            resize: none;
            font-size: 14px;
            line-height: 22px;
            padding: var(--space-4);
            border: none;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            width: 100%;
            height: 100%;
            background: var(--bg-card);
            color: var(--fg-default);
            overflow-y: auto;
            overflow-x: auto;
        }
        .mode-textarea:focus { outline: none; }

        /* ===== Mode Tabs ===== */
        .mode-tabs {
            display: flex;
            gap: 0;
            border-top: 1px solid var(--border-default);
            background: var(--bg-card);
            flex-shrink: 0;
            overflow-x: auto;
        }
        .mode-tab {
            padding: var(--space-3) var(--space-5);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--fg-muted);
            border: none;
            background: transparent;
            position: relative;
            transition: color var(--dur-fast) var(--ease-standard);
            white-space: nowrap;
            font-family: var(--font-family);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }
        .mode-tab:hover { color: var(--fg-default); }
        .mode-tab.active { color: var(--brand-primary); }
        .mode-tab.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--brand-primary);
        }

        /* ===== Status Bar ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-2) var(--space-4);
            font-size: 12px;
            line-height: 16px;
            font-weight: 500;
            color: var(--fg-muted);
            background: var(--bg-card);
            flex-shrink: 0;
            border-top: 1px solid var(--border-default);
        }

        /* ===== Bottom Sheet (mobile) ===== */
        .bottom-sheet-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(27,23,23,0.48);
            z-index: 199;
        }
        .bottom-sheet-overlay.open { display: block; }

        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border-default);
            border-radius: var(--r-xl) var(--r-xl) 0 0;
            padding: var(--space-5);
            z-index: 200;
            max-height: 75vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform var(--dur-base) var(--ease-standard);
            box-shadow: var(--sh-3);
        }
        .bottom-sheet.open { transform: translateY(0); }

        .bottom-sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-4);
            padding-bottom: var(--space-3);
            border-bottom: 1px solid var(--border-default);
        }
        .bottom-sheet-header span {
            font-size: 16px;
            font-weight: 600;
            color: var(--fg-default);
        }
        .bottom-sheet-close {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            border-radius: var(--r-md);
            cursor: pointer;
            color: var(--fg-muted);
            font-size: 16px;
            transition: background var(--dur-fast);
        }
        .bottom-sheet-close:hover { background: var(--bg-sunken); }

        .bs-section { margin-bottom: var(--space-5); }
        .bs-section:last-child { margin-bottom: 0; }
        .bs-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--fg-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--space-3);
        }
        .bs-row {
            display: flex;
            gap: var(--space-2);
        }
        .bs-btn {
            flex: 1;
            padding: var(--space-3);
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-family);
            border: 1px solid var(--border-default);
            border-radius: var(--r-md);
            background: var(--bg-card);
            color: var(--fg-default);
            cursor: pointer;
            text-align: center;
            transition: all var(--dur-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
        }
        .bs-btn:hover { background: var(--bg-sunken); border-color: var(--border-strong); }
        .bs-btn.active { background: var(--brand-primary-soft); border-color: var(--brand-primary); color: var(--brand-primary); }

        .bs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-2);
        }

        .bs-color-row {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3);
            border: 1px solid var(--border-default);
            border-radius: var(--r-md);
            background: var(--bg-sunken);
        }
        .bs-color-input {
            width: 44px;
            height: 44px;
            padding: 2px;
            border: 1px solid var(--border-default);
            border-radius: var(--r-sm);
            cursor: pointer;
        }
        .bs-color-hex {
            font-size: 14px;
            font-weight: 500;
            color: var(--fg-default);
            font-family: 'SF Mono', monospace;
        }

        /* ===== Scrollbar ===== */
        .editor-content::-webkit-scrollbar,
        .mode-textarea::-webkit-scrollbar { width: 8px; }
        .editor-content::-webkit-scrollbar-track,
        .mode-textarea::-webkit-scrollbar-track { background: var(--bg-sunken); }
        .editor-content::-webkit-scrollbar-thumb,
        .mode-textarea::-webkit-scrollbar-thumb { background: var(--n-300); border-radius: var(--r-xs); }
        .editor-content::-webkit-scrollbar-thumb:hover,
        .mode-textarea::-webkit-scrollbar-thumb:hover { background: var(--n-400); }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .toolbar { padding: var(--space-2) var(--space-3); gap: var(--space-1); }
            .toolbar-btn { height: 40px; padding: 0 var(--space-3); }
            .toolbar-btn .btn-label { display: none; }
            .desktop-only { display: none !important; }
            .editor-area { padding: var(--space-4); }
            .app-header { flex-direction: column; align-items: flex-start; gap: var(--space-2); padding: var(--space-3) var(--space-4); }
            .app-header h1 { font-size: 16px; line-height: 24px; }
            .header-right { width: 100%; }
            .char-stats { font-size: 12px; gap: var(--space-3); }
            .editor-area h1 { font-size: 28px; line-height: 36px; }
            .editor-area h2 { font-size: 22px; line-height: 28px; }
            .editor-area h3 { font-size: 18px; line-height: 24px; }
            .mode-tab { padding: var(--space-2) var(--space-3); font-size: 13px; }
        }
        @media (min-width: 769px) {
            .mobile-only { display: none !important; }
        }
        @media (max-width: 480px) {
            .toolbar-btn { height: 36px; padding: 0 var(--space-2); }
            .font-size-group { display: none; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <h1>리치 텍스트 에디터</h1>
        <div class="header-right">
            <div class="char-stats">
                <span class="stat-item">공백포함 <span class="stat-value" id="countWithSpaces">0</span></span>
                <span class="stat-divider"></span>
                <span class="stat-item">공백제외 <span class="stat-value" id="countNoSpaces">0</span></span>
                <span class="stat-divider"></span>
                <span class="stat-item">단어 <span class="stat-value" id="countWords">0</span></span>
            </div>
        </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar" id="toolbar">
        <button class="toolbar-btn" data-format="bold" title="굵게 (Ctrl+B)"><i class="fas fa-bold"></i><span class="btn-label desktop-only">굵게</span></button>
        <button class="toolbar-btn" data-format="italic" title="기울임 (Ctrl+I)"><i class="fas fa-italic"></i><span class="btn-label desktop-only">기울임</span></button>
        <button class="toolbar-btn" data-format="underline" title="밑줄 (Ctrl+U)"><i class="fas fa-underline"></i><span class="btn-label desktop-only">밑줄</span></button>

        <div class="toolbar-divider desktop-only"></div>

        <button class="toolbar-btn desktop-only" id="textColorBtn" title="글자색"><i class="fas fa-palette"></i><span class="btn-label">글자색</span></button>
        <input type="color" id="textColorPicker" class="color-picker-input desktop-only" value="#1B1717">
        <button class="toolbar-btn desktop-only" id="bgColorBtn" title="배경색"><i class="fas fa-highlighter"></i><span class="btn-label">배경색</span></button>
        <input type="color" id="bgColorPicker" class="color-picker-input desktop-only" value="#FFFF00">

        <div class="toolbar-divider desktop-only"></div>

        <button class="toolbar-btn" data-format="insertUnorderedList" title="글머리 목록"><i class="fas fa-list-ul"></i><span class="btn-label desktop-only">목록</span></button>
        <button class="toolbar-btn" data-format="insertOrderedList" title="번호 목록"><i class="fas fa-list-ol"></i><span class="btn-label desktop-only">번호</span></button>

        <div class="toolbar-divider desktop-only"></div>

    <script>
    (function () {
        'use strict';

        // ===== DOM References =====
        const editorEl = document.getElementById('editor');
        const htmlModeEl = document.getElementById('htmlMode');
        const markdownModeEl = document.getElementById('markdownMode');
        const countWithSpacesEl = document.getElementById('countWithSpaces');
        const countNoSpacesEl = document.getElementById('countNoSpaces');
        const countWordsEl = document.getElementById('countWords');
        const fontFamilySelect = document.getElementById('fontFamilySelect');
        const modeLabelEl = document.getElementById('modeLabel');
        const statusTextEl = document.getElementById('statusText');
        const fontSizeInput = document.getElementById('fontSizeInput');
        const textColorPicker = document.getElementById('textColorPicker');
        const bgColorPicker = document.getElementById('bgColorPicker');
        const mobileTextColorPicker = document.getElementById('mobileTextColorPicker');
        const mobileBgColorPicker = document.getElementById('mobileBgColorPicker');
        const textColorHexEl = document.getElementById('textColorHex');
        const bgColorHexEl = document.getElementById('bgColorHex');
        const bottomSheet = document.getElementById('bottomSheet');
        const bottomSheetOverlay = document.getElementById('bottomSheetOverlay');

        let currentFontSize = 16;
        let currentMode = 'editor';
        let savedSelection = null;

        const modeLabels = {
            editor: '에디터 모드',
            html: 'HTML 모드',
            markdown: 'Markdown 모드'
        };

        // ===== Utility: execCommand wrapper =====
        function exec(command, value) {
            try {
                document.execCommand(command, false, value || null);
            } catch (e) {
                console.error('execCommand failed:', command, e);
            }
        }

        // ===== Selection helpers =====
        function saveSelection() {
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                savedSelection = sel.getRangeAt(0).cloneRange();
            }
        }

        function restoreSelection() {
            if (!savedSelection) return;
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedSelection);
        }

        function placeSelectionMarkers() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return null;
            const range = sel.getRangeAt(0).cloneRange();
            const start = document.createElement('span');
            start.id = '__selStart';
            start.style.display = 'inline-block';
            start.style.width = '0';
            const end = document.createElement('span');
            end.id = '__selEnd';
            end.style.display = 'inline-block';
            end.style.width = '0';
            range.collapse(true);
            range.insertNode(start);
            const sel2 = window.getSelection();
            const r2 = sel2.getRangeAt(0).cloneRange();
            r2.collapse(false);
            r2.insertNode(end);
            return { startId: '__selStart', endId: '__selEnd' };
        }

        function restoreSelectionFromMarkers() {
            const s = document.getElementById('__selStart');
            const e = document.getElementById('__selEnd');
            if (!s || !e) return;
            const range = document.createRange();
            range.setStartAfter(s);
            range.setEndBefore(e);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
            s.parentNode && s.parentNode.removeChild(s);
            e.parentNode && e.parentNode.removeChild(e);
        }

        // ===== Node helpers =====
        function getClosest(el, tags) {
            let n = el;
            while (n && n !== editorEl) {
                if (n.nodeType === 1 && tags.includes(n.tagName)) return n;
                n = n.parentNode;
            }
            return null;
        }

        function closestSpecial(node) {
            while (node && node !== editorEl) {
                if (node.tagName === 'PRE') return 'PRE';
                if (node.tagName === 'BLOCKQUOTE') return 'BLOCKQUOTE';
                node = node.parentNode;
            }
            return null;
        }

        function isInsideSpecialBlock() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return null;
            let n = sel.getRangeAt(0).startContainer;
            if (n.nodeType === 3) n = n.parentNode;
            return closestSpecial(n);
        }

        function unwrap(el) {
            if (!el) return;
            const parent = el.parentNode;
            while (el.firstChild) parent.insertBefore(el.firstChild, el);
            parent.removeChild(el);
        }

        function wrapRangeWith(range, tagName) {
            const wrapper = document.createElement(tagName);
            const frag = range.extractContents();
            wrapper.appendChild(frag);
            range.insertNode(wrapper);
            return wrapper;
        }

        function ensureNotInside(tagName) {
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            let node = sel.getRangeAt(0).startContainer;
            if (node.nodeType === 3) node = node.parentNode;
            const target = getClosest(node, [tagName]);
            if (target) unwrap(target);
        }

        // ===== Guard: block conflicting operations in special blocks =====
        function guardSpecialBlock(actionName) {
            const special = isInsideSpecialBlock();
            if (special) {
                showStatus('⚠ ' + (special === 'PRE' ? '코드' : '인용문') + ' 블록 내에서 ' + actionName + '을(를) 변경할 수 없습니다.');
                return true;
            }
            return false;
        }

        function showStatus(msg) {
            statusTextEl.textContent = msg;
            setTimeout(function () { statusTextEl.textContent = '준비 완료'; }, 3000);
        }

        // ===== Font size =====
        function applyFontSizeToSelection(size) {
            size = Math.max(14, Math.min(64, parseInt(size) || 16));
            currentFontSize = size;
            fontSizeInput.value = size;
            const sel = window.getSelection();
            if (!sel.rangeCount) {
                editorEl.style.fontSize = size + 'px';
                return;
            }
            try {
                let node = sel.getRangeAt(0).startContainer;
                if (node.nodeType === 3) node = node.parentNode;
                const t = getClosest(node, ['P', 'H1', 'H2', 'H3', 'LI', 'DIV']);
                if (t) {
                    t.style.fontSize = size + 'px';
                }
            } catch (e) {
                console.error('Font size error:', e);
            }
        }

        fontSizeInput.addEventListener('input', function () { applyFontSizeToSelection(this.value); });
        fontSizeInput.addEventListener('change', function () { applyFontSizeToSelection(this.value); });
        document.getElementById('fontSizeUp').addEventListener('click', function (e) {
            e.preventDefault();
            applyFontSizeToSelection(currentFontSize + 1);
        });
        document.getElementById('fontSizeDown').addEventListener('click', function (e) {
            e.preventDefault();
            applyFontSizeToSelection(currentFontSize - 1);
        });

        function updateFontSizeDisplay() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            try {
                let node = sel.getRangeAt(0).startContainer;
                if (node.nodeType === 3) node = node.parentNode;
                const t = getClosest(node, ['P', 'H1', 'H2', 'H3', 'LI', 'DIV']);
                if (t) {
                    const style = t.getAttribute('style') || '';
                    const m = style.match(/font-size:\s*(\d+)px/);
                    if (m) {
                        fontSizeInput.value = m[1];
                        currentFontSize = parseInt(m[1]);
                    } else {
                        const computed = window.getComputedStyle(t).fontSize;
                        const sz = parseInt(computed);
                        fontSizeInput.value = sz;
                        currentFontSize = sz;
                    }
                }
            } catch (e) { /* ignore */ }
        }

        // ===== Color pickers =====
        document.getElementById('textColorBtn').addEventListener('click', function (e) {
            e.preventDefault();
            textColorPicker.click();
        });
        document.getElementById('bgColorBtn').addEventListener('click', function (e) {
            e.preventDefault();
            bgColorPicker.click();
        });
        textColorPicker.addEventListener('input', function () { exec('foreColor', this.value); editorEl.focus(); });
        bgColorPicker.addEventListener('input', function () { exec('backColor', this.value); editorEl.focus(); });

        mobileTextColorPicker.addEventListener('input', function () {
            exec('foreColor', this.value);
            textColorHexEl.textContent = this.value.toUpperCase();
            editorEl.focus();
        });
        mobileBgColorPicker.addEventListener('input', function () {
            exec('backColor', this.value);
            bgColorHexEl.textContent = this.value.toUpperCase();
            editorEl.focus();
        });

        // ===== Toolbar format buttons =====
        document.querySelectorAll('.toolbar-btn[data-format]').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                const fmt = this.getAttribute('data-format');
                // Guard alignment operations inside special blocks
                if (['justifyLeft', 'justifyCenter', 'justifyRight'].includes(fmt)) {
                    if (guardSpecialBlock('정렬')) return;
                }
                exec(fmt);
                updateToolbarState();
            });
        });

        // Bottom sheet format buttons
        document.querySelectorAll('.bs-btn[data-format]').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                const fmt = this.getAttribute('data-format');
                if (['justifyLeft', 'justifyCenter', 'justifyRight'].includes(fmt)) {
                    if (guardSpecialBlock('정렬')) return;
                }
                exec(fmt);
            });
        });

        // ===== Blockquote toggle =====
        function toggleBlockquote() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const special = closestSpecial(sel.getRangeAt(0).startContainer);

            // If inside blockquote, unwrap it
            if (special === 'BLOCKQUOTE') {
                const markers = placeSelectionMarkers();
                try {
                    let n = sel.getRangeAt(0).startContainer;
                    if (n.nodeType === 3) n = n.parentNode;
                    const bq = getClosest(n, ['BLOCKQUOTE']);
                    if (bq) unwrap(bq);
                } finally {
                    restoreSelectionFromMarkers();
                }
                return;
            }

            // Don't allow blockquote inside code
            if (special === 'PRE') {
                showStatus('⚠ 코드 블록 내에서 인용문을 삽입할 수 없습니다.');
                return;
            }

            ensureNotInside('PRE');
            const markers = placeSelectionMarkers();
            try {
                const r = sel.getRangeAt(0);
                if (r.collapsed) {
                    let n = r.startContainer;
                    if (n.nodeType === 3) n = n.parentNode;
                    let target = getClosest(n, ['P', 'H1', 'H2', 'H3', 'DIV', 'LI']);
                    if (!target) target = n;
                    const bq = document.createElement('BLOCKQUOTE');
                    while (target.firstChild) bq.appendChild(target.firstChild);
                    target.appendChild(bq);
                } else {
                    wrapRangeWith(r, 'BLOCKQUOTE');
                }
            } catch (e) {
                console.error('Blockquote toggle failed:', e);
            } finally {
                restoreSelectionFromMarkers();
            }
        }

        document.getElementById('blockquoteBtn').addEventListener('click', function (e) { e.preventDefault(); toggleBlockquote(); });
        document.getElementById('mobileBlockquoteBtn').addEventListener('click', function (e) { e.preventDefault(); toggleBlockquote(); });

        // ===== Code block toggle =====
        function addCopyButton(pre) {
            if (pre.querySelector('.copy-code-btn')) return;
            pre.style.position = 'relative';
            const btn = document.createElement('button');
            btn.className = 'copy-code-btn';
            btn.innerHTML = '<i class="fas fa-copy"></i> 복사';
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                const code = pre.textContent.replace(/복사$|✓ 복사됨$/, '').trim();
                navigator.clipboard.writeText(code).then(function () {
                    const orig = btn.innerHTML;
                    btn.innerHTML = '✓ 복사됨';
                    setTimeout(function () { btn.innerHTML = orig; }, 2000);
                }).catch(function () {
                    showStatus('복사 실패');
                });
            });
            pre.prepend(btn);
        }

        function toggleCode() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const special = closestSpecial(sel.getRangeAt(0).startContainer);

            // If inside code, unwrap
            if (special === 'PRE') {
                const markers = placeSelectionMarkers();
                try {
                    let n = sel.getRangeAt(0).startContainer;
                    if (n.nodeType === 3) n = n.parentNode;
                    const pre = getClosest(n, ['PRE']);
                    if (pre) {
                        const copyBtn = pre.querySelector('.copy-code-btn');
                        if (copyBtn) copyBtn.remove();
                        unwrap(pre);
                    }
                } finally {
                    restoreSelectionFromMarkers();
                }
                return;
            }

            // Don't allow code inside blockquote
            if (special === 'BLOCKQUOTE') {
                showStatus('⚠ 인용문 내에서 코드 블록을 삽입할 수 없습니다.');
                return;
            }

            ensureNotInside('BLOCKQUOTE');
            const markers = placeSelectionMarkers();
            try {
                const r = sel.getRangeAt(0);
                if (r.collapsed) {
                    let n = r.startContainer;
                    if (n.nodeType === 3) n = n.parentNode;
                    let target = getClosest(n, ['P', 'H1', 'H2', 'H3', 'DIV', 'LI']);
                    if (!target) target = n;
                    const pre = document.createElement('PRE');
                    while (target.firstChild) pre.appendChild(target.firstChild);
                    target.appendChild(pre);
                    addCopyButton(pre);
                } else {
                    const pre = wrapRangeWith(r, 'PRE');
                    addCopyButton(pre);
                }
            } catch (e) {
                console.error('Code toggle failed:', e);
            } finally {
                restoreSelectionFromMarkers();
            }
        }

        document.getElementById('codeBtn').addEventListener('click', function (e) { e.preventDefault(); toggleCode(); });
        document.getElementById('mobileCodeBtn').addEventListener('click', function (e) { e.preventDefault(); toggleCode(); });

        // ===== Style select (H1/H2/H3/P) =====
        document.getElementById('styleSelect').addEventListener('change', function () {
            const tag = this.value;
            if (!tag) return;
            if (guardSpecialBlock('스타일')) {
                this.selectedIndex = 0;
                return;
            }
            try {
                let node = window.getSelection().getRangeAt(0).startContainer;
                if (node.nodeType === 3) node = node.parentNode;
                const t = getClosest(node, ['P', 'H1', 'H2', 'H3', 'DIV', 'LI']);
                if (t) t.removeAttribute('style');
                document.execCommand('formatBlock', false, tag === 'p' ? '<p>' : '<' + tag + '>');
            } catch (e) {
                console.error('Style change failed:', e);
            }
            this.selectedIndex = 0;
            updateFontSizeDisplay();
        });

        // Mobile style buttons
        document.querySelectorAll('[data-mobile-style]').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                const tag = this.getAttribute('data-mobile-style');
                if (guardSpecialBlock('스타일')) return;
                try {
                    document.execCommand('formatBlock', false, tag === 'p' ? '<p>' : '<' + tag + '>');
                } catch (e) {
                    console.error('Mobile style change failed:', e);
                }
            });
        });

        // ===== Font family =====
        function applyFontFamily(family) {
            editorEl.style.fontFamily = "'" + family + "', sans-serif";
            if (fontFamilySelect) fontFamilySelect.value = family;
            // Highlight active mobile font button
            document.querySelectorAll('[data-font]').forEach(function (btn) {
                btn.classList.toggle('active', btn.getAttribute('data-font') === family);
            });
        }

        if (fontFamilySelect) {
            fontFamilySelect.addEventListener('change', function () {
                applyFontFamily(this.value);
                editorEl.focus();
            });
        }

        document.querySelectorAll('[data-font]').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                applyFontFamily(this.getAttribute('data-font'));
            });
        });

        // ===== Indent =====
        function applyIndentToSelection(level) {
            if (guardSpecialBlock('들여쓰기')) return;
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            try {
                let sN = sel.getRangeAt(0).startContainer;
                let eN = sel.getRangeAt(0).endContainer;
                if (sN.nodeType === 3) sN = sN.parentNode;
                if (eN.nodeType === 3) eN = eN.parentNode;
                const elements = new Set();
                function collect(node) {
                    if (!node || node === editorEl) return;
                    if (['P', 'H1', 'H2', 'H3', 'LI', 'DIV'].includes(node.tagName)) elements.add(node);
                    if (node.nodeType === 1) {
                        for (const child of node.children) {
                            if (['P', 'H1', 'H2', 'H3', 'LI', 'DIV'].includes(child.tagName)) elements.add(child);
                        }
                    }
                    collect(node.parentNode);
                }
                collect(sN);
                collect(eN);
                elements.forEach(function (el) {
                    for (let i = 0; i <= 6; i++) el.classList.remove('indent-level-' + i);
                    if (level !== '0' && level) el.classList.add('indent-level-' + level);
                });
            } catch (e) {
                console.error('Indent failed:', e);
            }
        }

        document.getElementById('indentSelect').addEventListener('change', function () {
            if (this.value !== '') {
                applyIndentToSelection(this.value);
                this.selectedIndex = 0;
            }
        });

        document.querySelectorAll('[data-indent]').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                applyIndentToSelection(this.getAttribute('data-indent'));
            });
        });

        // ===== Bottom Sheet =====
        function openBottomSheet() {
            saveSelection();
            bottomSheet.classList.add('open');
            bottomSheetOverlay.classList.add('open');
        }
        function closeBottomSheet() {
            bottomSheet.classList.remove('open');
            bottomSheetOverlay.classList.remove('open');
            editorEl.focus();
            restoreSelection();
        }

        document.getElementById('moreBtn').addEventListener('click', function (e) { e.preventDefault(); openBottomSheet(); });
        document.getElementById('closeBottomSheetBtn').addEventListener('click', function (e) { e.preventDefault(); closeBottomSheet(); });
        bottomSheetOverlay.addEventListener('click', closeBottomSheet);

        // ===== Character & word count =====
        function updateCharCount() {
            let text = '';
            if (currentMode === 'editor') text = editorEl.textContent;
            else if (currentMode === 'html') text = htmlModeEl.value;
            else if (currentMode === 'markdown') text = markdownModeEl.value;

            const withSpaces = text.length;
            const noSpaces = text.replace(/\s/g, '').length;
            const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;

            countWithSpacesEl.textContent = withSpaces.toLocaleString();
            countNoSpacesEl.textContent = noSpaces.toLocaleString();
            countWordsEl.textContent = words.toLocaleString();
        }
        editorEl.addEventListener('input', updateCharCount);
        htmlModeEl.addEventListener('input', updateCharCount);

        // ===== Keyboard shortcuts =====
        editorEl.addEventListener('keydown', function (e) {
            // Enter inside special blocks → line break only
            if (e.key === 'Enter') {
                const sel = window.getSelection();
                if (sel.rangeCount > 0) {
                    let node = sel.anchorNode;
                    const parent = node.nodeType === 3 ? node.parentNode : node;
                    if (getClosest(parent, ['PRE', 'BLOCKQUOTE'])) {
                        e.preventDefault();
                        exec('insertLineBreak');
                    }
                }
                return;
            }
            const ctrl = e.ctrlKey || e.metaKey;
            if (ctrl && e.key.toLowerCase() === 'b') { e.preventDefault(); exec('bold'); }
            if (ctrl && e.key.toLowerCase() === 'i') { e.preventDefault(); exec('italic'); }
            if (ctrl && e.key.toLowerCase() === 'u') { e.preventDefault(); exec('underline'); }
        });

        // ===== Toolbar state =====
        function updateToolbarState() {
            ['bold', 'italic', 'underline', 'insertUnorderedList', 'insertOrderedList'].forEach(function (cmd) {
                try {
                    const btn = document.querySelector('.toolbar-btn[data-format="' + cmd + '"]');
                    if (!btn) return;
                    if (document.queryCommandState(cmd)) btn.classList.add('active');
                    else btn.classList.remove('active');
                } catch (e) { /* ignore */ }
            });
        }

        document.addEventListener('selectionchange', function () {
            updateToolbarState();
            updateFontSizeDisplay();
        });
        editorEl.addEventListener('mouseup', updateToolbarState);

        // ===== Auto-add copy buttons to PRE elements =====
        editorEl.addEventListener('click', function () {
            setTimeout(function () {
                editorEl.querySelectorAll('pre').forEach(addCopyButton);
            }, 10);
        });

        // ===== HTML Prettify =====
        function prettifyHTML(html) {
            let formatted = '';
            let indent = 0;
            const indentStr = '  ';
            const voidElements = ['area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input', 'link', 'meta', 'param', 'source', 'track', 'wbr'];

            const temp = document.createElement('div');
            temp.innerHTML = html;

            // Wrap naked text nodes in <p>
            Array.from(temp.childNodes).forEach(function (node) {
                if (node.nodeType === 3 && node.textContent.trim()) {
                    const p = document.createElement('p');
                    p.textContent = node.textContent;
                    temp.replaceChild(p, node);
                }
            });

            html = temp.innerHTML;
            const regex = /(<[^/>]*>)|(<\/[^>]*>)|([^<]+)/g;
            let match;

            while ((match = regex.exec(html)) !== null) {
                const content = match[0].trim();
                if (!content) continue;
                if (content.startsWith('</')) {
                    indent = Math.max(0, indent - 1);
                    formatted += indentStr.repeat(indent) + content + '\n';
                } else if (content.startsWith('<') && content.endsWith('/>')) {
                    formatted += indentStr.repeat(indent) + content + '\n';
                } else if (content.startsWith('<')) {
                    const tagName = (content.match(/<(\w+)/) || [])[1];
                    formatted += indentStr.repeat(indent) + content + '\n';
                    if (tagName && !voidElements.includes(tagName.toLowerCase())) indent++;
                } else {
                    if (content.trim()) formatted += indentStr.repeat(indent) + content + '\n';
                }
            }
            return formatted.trim();
        }

        // ===== HTML → Markdown conversion =====
        function htmlToMarkdown(html) {
            const temp = document.createElement('div');
            temp.innerHTML = html;
            return nodeToMarkdown(temp).trim().replace(/\n{3,}/g, '\n\n');
        }

        function nodeToMarkdown(node) {
            let md = '';
            node.childNodes.forEach(function (child) {
                if (child.nodeType === 3) {
                    md += child.textContent;
                    return;
                }
                if (child.nodeType !== 1) return;

                const tag = child.tagName;
                const inner = nodeToMarkdown(child);

                switch (tag) {
                    case 'H1': md += '\n# ' + inner.trim() + '\n\n'; break;
                    case 'H2': md += '\n## ' + inner.trim() + '\n\n'; break;
                    case 'H3': md += '\n### ' + inner.trim() + '\n\n'; break;
                    case 'P':
                    case 'DIV': md += inner.trim() + '\n\n'; break;
                    case 'BR': md += '\n'; break;
                    case 'STRONG':
                    case 'B': md += '**' + inner + '**'; break;
                    case 'EM':
                    case 'I': md += '*' + inner + '*'; break;
                    case 'U': md += '<u>' + inner + '</u>'; break;
                    case 'BLOCKQUOTE':
                        md += '\n' + inner.trim().split('\n').map(function (l) { return '> ' + l; }).join('\n') + '\n\n';
                        break;
                    case 'PRE':
                        // Remove copy button text from code
                        let code = child.textContent;
                        const copyBtn = child.querySelector('.copy-code-btn');
                        if (copyBtn) code = code.replace(copyBtn.textContent, '').trim();
                        md += '\n```\n' + code + '\n```\n\n';
                        break;
                    case 'UL':
                        child.querySelectorAll(':scope > li').forEach(function (li) {
                            md += '- ' + nodeToMarkdown(li).trim() + '\n';
                        });
                        md += '\n';
                        break;
                    case 'OL':
                        var idx = 1;
                        child.querySelectorAll(':scope > li').forEach(function (li) {
                            md += idx + '. ' + nodeToMarkdown(li).trim() + '\n';
                            idx++;
                        });
                        md += '\n';
                        break;
                    case 'LI': md += inner; break;
                    case 'A':
                        var href = child.getAttribute('href') || '';
                        md += '[' + inner + '](' + href + ')';
                        break;
                    case 'SPAN':
                    case 'FONT': md += inner; break;
                    case 'BUTTON': break; // skip copy buttons
                    default: md += inner; break;
                }
            });
            return md;
        }

        // ===== Mode switching =====
        function switchMode(mode) {
            if (mode === 'html') {
                htmlModeEl.value = prettifyHTML(editorEl.innerHTML);
            } else if (mode === 'markdown') {
                markdownModeEl.value = htmlToMarkdown(editorEl.innerHTML);
            } else if (mode === 'editor' && currentMode === 'html') {
                editorEl.innerHTML = htmlModeEl.value;
                // Re-add copy buttons
                editorEl.querySelectorAll('pre').forEach(addCopyButton);
            }

            editorEl.style.display = mode === 'editor' ? 'block' : 'none';
            htmlModeEl.style.display = mode === 'html' ? 'block' : 'none';
            markdownModeEl.style.display = mode === 'markdown' ? 'block' : 'none';

            document.querySelectorAll('.mode-tab').forEach(function (t) { t.classList.remove('active'); });
            document.querySelector('.mode-tab[data-mode="' + mode + '"]').classList.add('active');

            modeLabelEl.textContent = modeLabels[mode];
            currentMode = mode;
            updateCharCount();

            if (mode === 'editor') editorEl.focus();
            else if (mode === 'html') htmlModeEl.focus();
        }

        document.querySelectorAll('.mode-tab').forEach(function (tab) {
            tab.addEventListener('click', function (e) {
                e.preventDefault();
                switchMode(this.getAttribute('data-mode'));
            });
        });

        // ===== Init =====
        editorEl.focus();
        updateCharCount();
    })();
    </script>
</body>
</html>
