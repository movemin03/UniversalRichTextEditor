<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="referrer" content="no-referrer">
    <title>thinkgood 리치 텍스트 에디터</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===== Design Tokens (from DesignTone.md) ===== */
        :root {
            /* Brand */
            --brand-primary: #EC1B1B;
            --brand-primary-hover: #D61818;
            --brand-primary-pressed: #B81515;
            --brand-primary-soft: rgba(236,27,27,0.08);
            --brand-secondary: #111111;

            /* Neutral (warm, red-tinted) */
            --n-0: #FFFFFF;
            --n-50: #FFFCFC;
            --n-100: #F6F2F2;
            --n-200: #E9E2E2;
            --n-300: #D4CECE;
            --n-400: #B5ABAB;
            --n-500: #8C8181;
            --n-700: #5B5252;
            --n-900: #1B1717;

            /* Semantic */
            --state-info: #1C6AE4;
            --state-info-soft: #E7F0FD;

            /* Surface / Role */
            --bg-page: var(--n-50);
            --bg-card: var(--n-0);
            --bg-sunken: var(--n-100);
            --fg-default: var(--n-900);
            --fg-muted: var(--n-500);
            --fg-subtle: var(--n-400);
            --border-default: var(--n-200);
            --border-strong: var(--n-300);
            --border-focus: var(--brand-primary);

            /* Shadows */
            --sh-0: none;
            --sh-1: 0 1px 2px rgba(27,23,23,0.04), 0 1px 1px rgba(27,23,23,0.02);
            --sh-2: 0 4px 12px rgba(27,23,23,0.06), 0 1px 2px rgba(27,23,23,0.04);
            --sh-3: 0 12px 32px rgba(27,23,23,0.10), 0 2px 6px rgba(27,23,23,0.04);
            --sh-focus: 0 0 0 3px rgba(236,27,27,0.30);

            /* Radius */
            --r-xs: 4px;
            --r-sm: 6px;
            --r-md: 8px;
            --r-lg: 12px;
            --r-xl: 16px;

            /* Motion */
            --dur-fast: 120ms;
            --dur-base: 180ms;
            --ease-standard: cubic-bezier(0.2, 0, 0, 1);

            /* Spacing */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;

            /* Typography */
            --font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* ===== Reset & Base ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: var(--font-family);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: var(--bg-page);
            color: var(--fg-default);
        }
        body { display: flex; flex-direction: column; }

        /* ===== Header ===== */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-3) var(--space-4);
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-default);
            flex-shrink: 0;
        }
        .app-header h1 {
            font-size: 20px;
            line-height: 28px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--fg-default);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }
        .char-stats {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            font-size: 13px;
            line-height: 20px;
            font-weight: 500;
            color: var(--fg-muted);
        }
        .char-stats .stat-item {
            display: flex;
            align-items: center;
            gap: var(--space-1);
            white-space: nowrap;
        }
        .char-stats .stat-value {
            color: var(--fg-default);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .char-stats .stat-divider {
            width: 1px;
            height: 12px;
            background: var(--border-default);
        }

        /* ===== Toolbar ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-default);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: var(--border-default);
            margin: 0 var(--space-1);
        }
        .toolbar-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-1);
            height: 36px;
            padding: 0 var(--space-3);
            background: var(--bg-sunken);
            border: 1px solid var(--border-default);
            border-radius: var(--r-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-family);
            color: var(--fg-default);
            transition: all var(--dur-fast) var(--ease-standard);
            user-select: none;
            white-space: nowrap;
        }
        .toolbar-btn:hover {
            background: var(--n-200);
            border-color: var(--border-strong);
        }
        .toolbar-btn.active {
            background: var(--brand-primary);
            color: var(--n-0);
            border-color: var(--brand-primary);
        }
        .toolbar-btn.active:hover {
            background: var(--brand-primary-hover);
        }
        .toolbar-btn i { font-size: 13px; }
        .toolbar-btn .btn-label { font-size: 13px; }

        .toolbar-select {
            height: 36px;
            padding: 0 var(--space-3);
            background: var(--bg-sunken);
            border: 1px solid var(--border-default);
            border-radius: var(--r-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-family);
            color: var(--fg-default);
            transition: border-color var(--dur-fast) var(--ease-standard);
        }
        .toolbar-select:hover { border-color: var(--border-strong); }
        .toolbar-select:focus { outline: none; border-color: var(--border-focus); box-shadow: var(--sh-focus); }

        .font-size-group {
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }
        .font-size-input {
            width: 56px;
            height: 36px;
            padding: 0 var(--space-2);
            border: 1px solid var(--border-default);
            border-radius: var(--r-sm);
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-family);
            text-align: center;
            background: var(--bg-sunken);
            color: var(--fg-default);
            transition: border-color var(--dur-fast) var(--ease-standard);
        }
        .font-size-input:focus { outline: none; border-color: var(--border-focus); box-shadow: var(--sh-focus); background: var(--bg-card); }
        .font-size-unit { font-size: 12px; color: var(--fg-muted); font-weight: 500; }

        .font-size-spinner {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .font-size-spinner-btn {
            width: 20px;
            height: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-default);
            background: var(--bg-sunken);
            cursor: pointer;
            font-size: 8px;
            color: var(--fg-muted);
            transition: background var(--dur-fast);
        }
        .font-size-spinner-btn:hover { background: var(--n-200); color: var(--fg-default); }
        .font-size-spinner-up { border-radius: var(--r-xs) var(--r-xs) 0 0; border-bottom: none; }
        .font-size-spinner-down { border-radius: 0 0 var(--r-xs) var(--r-xs); }

        .color-picker-input {
            width: 36px;
            height: 36px;
            padding: 2px;
            border: 1px solid var(--border-default);
            border-radius: var(--r-sm);
            cursor: pointer;
            background: var(--bg-sunken);
            transition: border-color var(--dur-fast);
        }
        .color-picker-input:hover { border-color: var(--border-strong); }
        .color-picker-input:focus { outline: none; border-color: var(--border-focus); }

        /* ===== Editor Container ===== */
        .editor-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            background: var(--bg-card);
        }
        .editor-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* ===== Editor Area (contenteditable) ===== */
        .editor-area {
            outline: none;
            resize: none;
            min-height: 100%;
            padding: var(--space-6);
            font-size: 16px;
            line-height: 24px;
            font-weight: 400;
            color: var(--fg-default);
        }
        .editor-area:empty::before {
            content: attr(data-placeholder);
            color: var(--fg-subtle);
            pointer-events: none;
        }

        /* Indent levels */
        .editor-area .indent-level-1 { padding-left: 40px !important; }
        .editor-area .indent-level-2 { padding-left: 80px !important; }
        .editor-area .indent-level-3 { padding-left: 120px !important; }
        .editor-area .indent-level-4 { padding-left: 160px !important; }
        .editor-area .indent-level-5 { padding-left: 200px !important; }
        .editor-area .indent-level-6 { padding-left: 240px !important; }

        /* Typography inside editor — aligned to DesignTone.md */
        .editor-area p {
            margin: 0;
            padding: 0;
            font-size: 16px;
            line-height: 24px;
            font-weight: 400;
        }
        .editor-area h1 {
            font-size: 32px;
            line-height: 40px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0;
            padding: var(--space-6) 0 var(--space-2) 0;
            color: var(--fg-default);
        }
        .editor-area h2 {
            font-size: 24px;
            line-height: 32px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 0;
            padding: var(--space-5) 0 var(--space-1) 0;
            color: var(--fg-default);
        }
        .editor-area h3 {
            font-size: 20px;
            line-height: 28px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin: 0;
            padding: var(--space-4) 0 var(--space-1) 0;
            color: var(--fg-default);
        }
        .editor-area ul, .editor-area ol {
            margin: var(--space-2) 0;
            padding-left: var(--space-6);
        }
        .editor-area ul { list-style-type: disc; }
        .editor-area ol { list-style-type: decimal; }
        .editor-area li {
            margin: var(--space-1) 0;
            font-size: 16px;
            line-height: 24px;
        }

        /* Blockquote — brand accent left border, sunken bg */
        .editor-area blockquote {
            margin: var(--space-3) 0;
            padding: var(--space-4) var(--space-5);
            border: none;
            background: var(--bg-sunken);
            border-radius: var(--r-lg);
            color: var(--n-700);
            font-size: 16px;
            line-height: 24px;
            position: relative;
        }

        /* Code block — sunken bg, monospace */
        .editor-area pre {
            margin: var(--space-3) 0;
            padding: var(--space-5);
            padding-top: 44px;
            background: var(--n-900);
            color: var(--n-100);
            border: 1px solid var(--n-700);
            border-radius: var(--r-md);
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 22px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            position: relative;
        }
        .editor-area pre .copy-code-btn {
            position: absolute;
            top: var(--space-2);
            right: var(--space-2);
            background: var(--n-700);
            color: var(--n-200);
            border: none;
            border-radius: var(--r-xs);
            padding: var(--space-1) var(--space-2);
            cursor: pointer;
            font-size: 12px;
            font-family: var(--font-family);
            font-weight: 500;
            transition: background var(--dur-fast);
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }
        .editor-area pre .copy-code-btn:hover { background: var(--n-500); }

        /* Alignment helpers */
        .editor-area [style*="text-align: center"] { text-align: center !important; }
        .editor-area [style*="text-align: right"] { text-align: right !important; }

        /* ===== Mode Textarea (HTML / Markdown) ===== */
        .mode-textarea {
            outline: none;
            resize: none;
            font-size: 14px;
            line-height: 22px;
            padding: var(--space-4);
            border: none;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            width: 100%;
            height: 100%;
            background: var(--bg-card);
            color: var(--fg-default);
            overflow-y: auto;
            overflow-x: auto;
        }
        .mode-textarea:focus { outline: none; }

        /* ===== Mode Tabs ===== */
        .mode-tabs {
            display: flex;
            gap: 0;
            border-top: 1px solid var(--border-default);
            background: var(--bg-card);
            flex-shrink: 0;
            overflow-x: auto;
        }
        .mode-tab {
            padding: var(--space-3) var(--space-5);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--fg-muted);
            border: none;
            background: transparent;
            position: relative;
            transition: color var(--dur-fast) var(--ease-standard);
            white-space: nowrap;
            font-family: var(--font-family);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }
        .mode-tab:hover { color: var(--fg-default); }
        .mode-tab.active { color: var(--brand-primary); }
        .mode-tab.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--brand-primary);
        }

        /* ===== Status Bar ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-2) var(--space-4);
            font-size: 12px;
            line-height: 16px;
            font-weight: 500;
            color: var(--fg-muted);
            background: var(--bg-card);
            flex-shrink: 0;
            border-top: 1px solid var(--border-default);
        }

        /* ===== Bottom Sheet (mobile) ===== */
        .bottom-sheet-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(27,23,23,0.48);
            z-index: 199;
        }
        .bottom-sheet-overlay.open { display: block; }

        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border-default);
            border-radius: var(--r-xl) var(--r-xl) 0 0;
            padding: var(--space-5);
            z-index: 200;
            max-height: 75vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform var(--dur-base) var(--ease-standard);
            box-shadow: var(--sh-3);
        }
        .bottom-sheet.open { transform: translateY(0); }

        .bottom-sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-4);
            padding-bottom: var(--space-3);
            border-bottom: 1px solid var(--border-default);
        }
        .bottom-sheet-header span {
            font-size: 16px;
            font-weight: 600;
            color: var(--fg-default);
        }
        .bottom-sheet-close {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            border-radius: var(--r-md);
            cursor: pointer;
            color: var(--fg-muted);
            font-size: 16px;
            transition: background var(--dur-fast);
        }
        .bottom-sheet-close:hover { background: var(--bg-sunken); }

        .bs-section { margin-bottom: var(--space-5); }
        .bs-section:last-child { margin-bottom: 0; }
        .bs-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--fg-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--space-3);
        }
        .bs-row {
            display: flex;
            gap: var(--space-2);
        }
        .bs-btn {
            flex: 1;
            padding: var(--space-3);
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-family);
            border: 1px solid var(--border-default);
            border-radius: var(--r-md);
            background: var(--bg-card);
            color: var(--fg-default);
            cursor: pointer;
            text-align: center;
            transition: all var(--dur-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
        }
        .bs-btn:hover { background: var(--bg-sunken); border-color: var(--border-strong); }
        .bs-btn.active { background: var(--brand-primary-soft); border-color: var(--brand-primary); color: var(--brand-primary); }

        .bs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-2);
        }

        .bs-color-row {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3);
            border: 1px solid var(--border-default);
            border-radius: var(--r-md);
            background: var(--bg-sunken);
        }
        .bs-color-input {
            width: 44px;
            height: 44px;
            padding: 2px;
            border: 1px solid var(--border-default);
            border-radius: var(--r-sm);
            cursor: pointer;
        }
        .bs-color-hex {
            font-size: 14px;
            font-weight: 500;
            color: var(--fg-default);
            font-family: 'SF Mono', monospace;
        }

        /* ===== Editor images & embeds ===== */
        .editor-area img {
            max-width: 100%;
            height: auto;
            border-radius: var(--r-md);
            margin: var(--space-3) 0;
            display: block;
            cursor: pointer;
        }
        .editor-area .video-embed {
            position: relative;
            max-width: 560px;
            margin: var(--space-3) 0;
            border-radius: var(--r-md);
            background: var(--n-900);
            cursor: pointer;
            aspect-ratio: 16 / 9;
        }
        .editor-area .video-embed iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: var(--r-md);
            pointer-events: none;
        }
        .editor-area .video-embed.video-active iframe {
            pointer-events: auto;
        }

        /* Resizable wrapper */
        .media-resizable {
            position: relative;
            display: inline-block;
            max-width: 100%;
            margin: var(--space-3) 0;
            line-height: 0;
            overflow: hidden;
            vertical-align: top;
        }
        .media-resizable img {
            margin: 0;
            display: block;
            width: 100%;
            height: auto;
        }
        .media-resizable .video-embed {
            margin: 0;
            width: 100%;
        }

        /* Selected state */
        .media-resizable.media-selected {
            outline: 2px solid var(--brand-primary);
            outline-offset: 2px;
            border-radius: var(--r-md);
        }

        /* Resize handles */
        .media-resizable .resize-handle {
            display: none;
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--brand-primary);
            border: 2px solid var(--n-0);
            border-radius: 50%;
            z-index: 10;
            box-shadow: var(--sh-2);
        }
        .media-resizable.media-selected .resize-handle { display: block; }
        .resize-handle-nw { top: -6px; left: -6px; cursor: nw-resize; }
        .resize-handle-ne { top: -6px; right: -6px; cursor: ne-resize; }
        .resize-handle-sw { bottom: -6px; left: -6px; cursor: sw-resize; }
        .resize-handle-se { bottom: -6px; right: -6px; cursor: se-resize; }

        /* ===== Image Context Menu ===== */
        .img-context-menu {
            display: none;
            position: fixed;
            z-index: 400;
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: var(--r-md);
            box-shadow: var(--sh-3);
            padding: var(--space-1) 0;
            min-width: 180px;
        }
        .img-context-menu.open { display: block; }
        .img-context-item {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            width: 100%;
            padding: var(--space-2) var(--space-4);
            border: none;
            background: none;
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-family);
            color: var(--fg-default);
            cursor: pointer;
            text-align: left;
        }
        .img-context-item:hover {
            background: var(--bg-sunken);
        }
        .img-context-item i { color: var(--fg-muted); width: 16px; text-align: center; }
        .editor-area a {
            color: var(--brand-primary);
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .editor-area a:hover {
            color: var(--brand-primary-hover);
        }

        /* ===== Insert Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(27,23,23,0.48);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: var(--bg-card);
            border-radius: var(--r-xl);
            box-shadow: var(--sh-3);
            width: 90%;
            max-width: 480px;
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-5) var(--space-5) var(--space-3);
        }
        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--fg-default);
        }
        .modal-body {
            padding: 0 var(--space-5) var(--space-4);
        }
        .modal-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--fg-muted);
            margin-bottom: var(--space-2);
        }
        .modal-input {
            width: 100%;
            height: 44px;
            padding: 0 var(--space-3);
            border: 1px solid var(--border-default);
            border-radius: var(--r-md);
            font-size: 15px;
            font-family: var(--font-family);
            color: var(--fg-default);
            background: var(--bg-sunken);
            transition: border-color var(--dur-fast);
        }
        .modal-input:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: var(--sh-focus);
            background: var(--bg-card);
        }
        .modal-input::placeholder { color: var(--fg-subtle); }
        .modal-field { margin-top: var(--space-3); }
        .modal-hint {
            margin-top: var(--space-2);
            font-size: 12px;
            color: var(--fg-muted);
            line-height: 16px;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-5) var(--space-5);
        }
        .modal-cancel, .modal-confirm {
            height: 40px;
            padding: 0 var(--space-4);
            border-radius: var(--r-md);
            font-size: 15px;
            font-weight: 600;
            font-family: var(--font-family);
            cursor: pointer;
            transition: all var(--dur-fast);
        }
        .modal-cancel {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            color: var(--fg-default);
        }
        .modal-cancel:hover { background: var(--bg-sunken); }
        .modal-confirm {
            background: var(--brand-primary);
            border: none;
            color: var(--n-0);
        }
        .modal-confirm:hover { background: var(--brand-primary-hover); }

        /* ===== Scrollbar ===== */
        .editor-content::-webkit-scrollbar,
        .mode-textarea::-webkit-scrollbar { width: 8px; }
        .editor-content::-webkit-scrollbar-track,
        .mode-textarea::-webkit-scrollbar-track { background: var(--bg-sunken); }
        .editor-content::-webkit-scrollbar-thumb,
        .mode-textarea::-webkit-scrollbar-thumb { background: var(--n-300); border-radius: var(--r-xs); }
        .editor-content::-webkit-scrollbar-thumb:hover,
        .mode-textarea::-webkit-scrollbar-thumb:hover { background: var(--n-400); }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .toolbar { padding: var(--space-2) var(--space-3); gap: var(--space-1); }
            .toolbar-btn { height: 40px; padding: 0 var(--space-3); }
            .toolbar-btn .btn-label { display: none; }
            .desktop-only { display: none !important; }
            .editor-area { padding: var(--space-4); }
            .app-header { flex-direction: column; align-items: flex-start; gap: var(--space-2); padding: var(--space-3) var(--space-4); }
            .app-header h1 { font-size: 16px; line-height: 24px; }
            .header-right { width: 100%; }
            .char-stats { font-size: 12px; gap: var(--space-3); }
            .editor-area h1 { font-size: 28px; line-height: 36px; }
            .editor-area h2 { font-size: 22px; line-height: 28px; }
            .editor-area h3 { font-size: 18px; line-height: 24px; }
            .mode-tab { padding: var(--space-2) var(--space-3); font-size: 13px; }
        }
        @media (min-width: 769px) {
            .mobile-only { display: none !important; }
        }
        @media (max-width: 480px) {
            .toolbar-btn { height: 36px; padding: 0 var(--space-2); }
            .font-size-group { display: none; }
        }
    </style>
</head>
<body>

    <script>
    (function () {
        'use strict';

        // ===== DOM References =====
        const editorEl = document.getElementById('editor');
        const htmlModeEl = document.getElementById('htmlMode');
        const markdownModeEl = document.getElementById('markdownMode');
        const countWithSpacesEl = document.getElementById('countWithSpaces');
        const countNoSpacesEl = document.getElementById('countNoSpaces');
        const countWordsEl = document.getElementById('countWords');
        const fontFamilySelect = document.getElementById('fontFamilySelect');
        const modeLabelEl = document.getElementById('modeLabel');
        const statusTextEl = document.getElementById('statusText');
        const fontSizeInput = document.getElementById('fontSizeInput');
        const textColorPicker = document.getElementById('textColorPicker');
        const bgColorPicker = document.getElementById('bgColorPicker');
        const mobileTextColorPicker = document.getElementById('mobileTextColorPicker');
        const mobileBgColorPicker = document.getElementById('mobileBgColorPicker');
        const textColorHexEl = document.getElementById('textColorHex');
        const bgColorHexEl = document.getElementById('bgColorHex');
        const bottomSheet = document.getElementById('bottomSheet');
        const bottomSheetOverlay = document.getElementById('bottomSheetOverlay');

        let currentFontSize = 16;
        let currentMode = 'editor';
        let savedSelection = null;

        const modeLabels = {
            editor: '에디터 모드',
            html: 'HTML 모드',
            markdown: 'Markdown 모드'
        };

        // ===== Utility: execCommand wrapper =====
        function exec(command, value) {
            try {
                document.execCommand(command, false, value || null);
            } catch (e) {
                console.error('execCommand failed:', command, e);
            }
        }

        // ===== Selection helpers =====
        function saveSelection() {
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                savedSelection = sel.getRangeAt(0).cloneRange();
            }
        }

        function restoreSelection() {
            if (!savedSelection) return;
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedSelection);
        }

        function placeSelectionMarkers() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return null;
            const range = sel.getRangeAt(0).cloneRange();
            const start = document.createElement('span');
            start.id = '__selStart';
            start.style.display = 'inline-block';
            start.style.width = '0';
            const end = document.createElement('span');
            end.id = '__selEnd';
            end.style.display = 'inline-block';
            end.style.width = '0';
            range.collapse(true);
            range.insertNode(start);
            const sel2 = window.getSelection();
            const r2 = sel2.getRangeAt(0).cloneRange();
            r2.collapse(false);
            r2.insertNode(end);
            return { startId: '__selStart', endId: '__selEnd' };
        }

        function restoreSelectionFromMarkers() {
            const s = document.getElementById('__selStart');
            const e = document.getElementById('__selEnd');
            if (!s || !e) return;
            const range = document.createRange();
            range.setStartAfter(s);
            range.setEndBefore(e);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
            s.parentNode && s.parentNode.removeChild(s);
            e.parentNode && e.parentNode.removeChild(e);
        }

        // ===== Node helpers =====
        function getClosest(el, tags) {
            let n = el;
            while (n && n !== editorEl) {
                if (n.nodeType === 1 && tags.includes(n.tagName)) return n;
                n = n.parentNode;
            }
            return null;
        }

        function closestSpecial(node) {
            while (node && node !== editorEl) {
                if (node.tagName === 'PRE') return 'PRE';
                if (node.tagName === 'BLOCKQUOTE') return 'BLOCKQUOTE';
                node = node.parentNode;
            }
            return null;
        }

        function isInsideSpecialBlock() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return null;
            let n = sel.getRangeAt(0).startContainer;
            if (n.nodeType === 3) n = n.parentNode;
            return closestSpecial(n);
        }

        function unwrap(el) {
            if (!el) return;
            const parent = el.parentNode;
            while (el.firstChild) parent.insertBefore(el.firstChild, el);
            parent.removeChild(el);
        }

        function wrapRangeWith(range, tagName) {
            const wrapper = document.createElement(tagName);
            const frag = range.extractContents();
            wrapper.appendChild(frag);
            range.insertNode(wrapper);
            return wrapper;
        }

        function ensureNotInside(tagName) {
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            let node = sel.getRangeAt(0).startContainer;
            if (node.nodeType === 3) node = node.parentNode;
            const target = getClosest(node, [tagName]);
            if (target) unwrap(target);
        }

        // ===== Guard: block conflicting operations in special blocks =====
        function guardSpecialBlock(actionName) {
            const special = isInsideSpecialBlock();
            if (special) {
                showStatus('⚠ ' + (special === 'PRE' ? '코드' : '인용문') + ' 블록 내에서 ' + actionName + '을(를) 변경할 수 없습니다.');
                return true;
            }
            return false;
        }

        function showStatus(msg) {
            statusTextEl.textContent = msg;
            setTimeout(function () { statusTextEl.textContent = '준비 완료'; }, 3000);
        }

        // ===== Font size =====
        function applyFontSizeToSelection(size) {
            size = Math.max(14, Math.min(64, parseInt(size) || 16));
            currentFontSize = size;
            fontSizeInput.value = size;
            const sel = window.getSelection();
            if (!sel.rangeCount) {
                editorEl.style.fontSize = size + 'px';
                return;
            }
            try {
                let node = sel.getRangeAt(0).startContainer;
                if (node.nodeType === 3) node = node.parentNode;
                const t = getClosest(node, ['P', 'H1', 'H2', 'H3', 'LI', 'DIV']);
                if (t) {
                    t.style.fontSize = size + 'px';
                }
            } catch (e) {
                console.error('Font size error:', e);
            }
        }

        fontSizeInput.addEventListener('input', function () { applyFontSizeToSelection(this.value); });
        fontSizeInput.addEventListener('change', function () { applyFontSizeToSelection(this.value); });
        document.getElementById('fontSizeUp').addEventListener('click', function (e) {
            e.preventDefault();
            applyFontSizeToSelection(currentFontSize + 1);
        });
        document.getElementById('fontSizeDown').addEventListener('click', function (e) {
            e.preventDefault();
            applyFontSizeToSelection(currentFontSize - 1);
        });

        function updateFontSizeDisplay() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            try {
                let node = sel.getRangeAt(0).startContainer;
                if (node.nodeType === 3) node = node.parentNode;
                const t = getClosest(node, ['P', 'H1', 'H2', 'H3', 'LI', 'DIV']);
                if (t) {
                    const style = t.getAttribute('style') || '';
                    const m = style.match(/font-size:\s*(\d+)px/);
                    if (m) {
                        fontSizeInput.value = m[1];
                        currentFontSize = parseInt(m[1]);
                    } else {
                        const computed = window.getComputedStyle(t).fontSize;
                        const sz = parseInt(computed);
                        fontSizeInput.value = sz;
                        currentFontSize = sz;
                    }
                }
            } catch (e) { /* ignore */ }
        }

        // ===== Color pickers =====
        document.getElementById('textColorBtn').addEventListener('click', function (e) {
            e.preventDefault();
            textColorPicker.click();
        });
        document.getElementById('bgColorBtn').addEventListener('click', function (e) {
            e.preventDefault();
            bgColorPicker.click();
        });
        textColorPicker.addEventListener('input', function () { exec('foreColor', this.value); editorEl.focus(); });
        bgColorPicker.addEventListener('input', function () { exec('backColor', this.value); editorEl.focus(); });

        mobileTextColorPicker.addEventListener('input', function () {
            exec('foreColor', this.value);

        // ===== Blockquote toggle =====
        function toggleBlockquote() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const special = closestSpecial(sel.getRangeAt(0).startContainer);

            // If inside blockquote, unwrap it
            if (special === 'BLOCKQUOTE') {
                const markers = placeSelectionMarkers();
                try {
                    let n = sel.getRangeAt(0).startContainer;
                    if (n.nodeType === 3) n = n.parentNode;
                    const bq = getClosest(n, ['BLOCKQUOTE']);
                    if (bq) unwrap(bq);
                } finally {
                    restoreSelectionFromMarkers();
                }
                return;
            }

            // Don't allow blockquote inside code
            if (special === 'PRE') {
                showStatus('⚠ 코드 블록 내에서 인용문을 삽입할 수 없습니다.');
                return;
            }

            ensureNotInside('PRE');
            const markers = placeSelectionMarkers();
            try {
                const r = sel.getRangeAt(0);
                if (r.collapsed) {
                    let n = r.startContainer;
                    if (n.nodeType === 3) n = n.parentNode;
                    let target = getClosest(n, ['P', 'H1', 'H2', 'H3', 'DIV', 'LI']);
                    if (!target) target = n;
                    const bq = document.createElement('BLOCKQUOTE');
                    while (target.firstChild) bq.appendChild(target.firstChild);
                    target.appendChild(bq);
                } else {
                    wrapRangeWith(r, 'BLOCKQUOTE');
                }
            } catch (e) {
                console.error('Blockquote toggle failed:', e);
            } finally {
                restoreSelectionFromMarkers();
            }
        }

        function parseVideoUrl(url) {
            url = url.trim();
            // YouTube: various formats
            var m = url.match(/(?:youtube\.com\/(?:watch\?v=|live\/|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
            if (m) {
                var si = '';
                var siMatch = url.match(/[?&]si=([^&]+)/);
                if (siMatch) si = '?si=' + siMatch[1];
                return { type: 'youtube', id: m[1], src: 'https://www.youtube.com/embed/' + m[1] + si };
            }
            // Vimeo
            m = url.match(/vimeo\.com\/(\d+)/);
            if (m) {
                return { type: 'vimeo', id: m[1], src: 'https://player.vimeo.com/video/' + m[1] };
            }
            return null;
        }

        // Ensure selection is inside editor; if not, place cursor at end
        function ensureCursorInEditor() {
            var sel = window.getSelection();
            if (sel.rangeCount > 0) {
                var node = sel.getRangeAt(0).startContainer;
                if (editorEl.contains(node)) return; // already inside
            }
            // Place cursor at end of editor
            var range = document.createRange();
            range.selectNodeContents(editorEl);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
        }

        function doInsert() {
            var url = modalUrlInput.value.trim();
            if (!url) { modalUrlInput.focus(); return; }

            // Capture values BEFORE closing modal
            var type = insertType;
            var text = modalTextInput.value.trim();
            var savedRange = selectionBeforeModal;

            // Close modal
            closeInsertModal();

            // Restore focus and selection — MUST be inside editor
            editorEl.focus();
            if (savedRange && editorEl.contains(savedRange.startContainer)) {
                var sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(savedRange);
            } else {
                ensureCursorInEditor();
            }

            if (type === 'link') {
                var sel = window.getSelection();
                if (sel.rangeCount > 0 && !sel.isCollapsed) {
                    exec('createLink', url);
                } else {
                    var a = document.createElement('a');
                    a.href = url;
                    a.textContent = text || url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    insertNodeAtCursor(a);
                }
                // Ensure target=_blank on all matching links
                setTimeout(function () {
                    editorEl.querySelectorAll('a').forEach(function (a) {

                            a.target = '_blank';

            } else if (type === 'image') {
                var img = document.createElement('img');
                img.src = url;
                img.alt = '';
                insertBlockAtCursor(img);

            } else if (type === 'video') {
                var parsed = parseVideoUrl(url);
                if (!parsed) {
                    showStatus('지원하지 않는 영상 URL입니다. (YouTube, Vimeo 지원)');

                iframe.setAttribute('frameborder', '0');
                iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
                iframe.setAttribute('referrerpolicy', 'no-referrer');
                iframe.setAttribute('allowfullscreen', '');
                wrapper.appendChild(iframe);
                insertBlockAtCursor(wrapper);
            }

            // Reset state
            insertType = null;
            selectionBeforeModal = null;
            updateCharCount();
        }

        // Insert an inline node (like <a>) at cursor position
        // Check if current selection is inside the editor
        function isSelectionInEditor() {
            var sel = window.getSelection();
            if (!sel.rangeCount) return false;
            return editorEl.contains(sel.getRangeAt(0).startContainer);
        }

        function insertNodeAtCursor(node) {
            ensureCursorInEditor();
            var sel = window.getSelection();
            if (sel.rangeCount > 0 && isSelectionInEditor()) {
                var range = sel.getRangeAt(0);
                range.deleteContents();
                range.insertNode(node);
                range.setStartAfter(node);
                range.collapse(true);
                sel.removeAllRanges();
                sel.addRange(range);
            } else {
                editorEl.appendChild(node);
            }
        }

        // Insert a block element (image, video) — adds a new paragraph after for continued editing
        function insertBlockAtCursor(element) {
            ensureCursorInEditor();
            var sel = window.getSelection();
            var afterP = document.createElement('p');
            afterP.innerHTML = '<br>';

            if (sel.rangeCount > 0 && isSelectionInEditor()) {
                var range = sel.getRangeAt(0);
                range.deleteContents();

                // Walk up to a block-level parent to insert after it
                var block = range.startContainer;
                if (block.nodeType === 3) block = block.parentNode;
                while (block && block !== editorEl && !['P','H1','H2','H3','DIV','LI','BLOCKQUOTE','PRE'].includes(block.tagName)) {
                    block = block.parentNode;
                }

                if (block && block !== editorEl) {
                    block.parentNode.insertBefore(element, block.nextSibling);
                    element.parentNode.insertBefore(afterP, element.nextSibling);
                } else {
                    editorEl.appendChild(element);
                    editorEl.appendChild(afterP);
                }
            } else {
                editorEl.appendChild(element);
                editorEl.appendChild(afterP);
            }

            // Place cursor in the new paragraph
            var newRange = document.createRange();
            newRange.setStart(afterP, 0);
            newRange.collapse(true);
            sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(newRange);
        }

        // ===== Media Resizable Wrappers =====
        // Wrap img / .video-embed in a .media-resizable container with handles
        function wrapMediaElement(el) {
            // Don't double-wrap
            if (el.parentNode && el.parentNode.classList && el.parentNode.classList.contains('media-resizable')) return el.parentNode;
            var wrapper = document.createElement('div');
            wrapper.className = 'media-resizable';
            wrapper.contentEditable = 'false';
            // Default width (clamped to editor content area)
            var maxW = getMaxMediaWidth();
            if (el.tagName === 'IMG') {
                wrapper.style.width = Math.min(el.naturalWidth || 400, maxW) + 'px';
            } else {
                wrapper.style.width = Math.min(560, maxW) + 'px';
            }
            el.parentNode.insertBefore(wrapper, el);
            wrapper.appendChild(el);
            // Add resize handles
            ['nw','ne','sw','se'].forEach(function (pos) {
                var handle = document.createElement('div');
                handle.className = 'resize-handle resize-handle-' + pos;
                handle.setAttribute('data-handle', pos);
                wrapper.appendChild(handle);
            });
            return wrapper;
        }

        // Ensure all images/videos in editor are wrapped
        function ensureMediaWrapped() {
            editorEl.querySelectorAll('img').forEach(function (img) {
                if (!img.closest('.media-resizable')) wrapMediaElement(img);
            });
            editorEl.querySelectorAll('.video-embed').forEach(function (ve) {
                if (!ve.closest('.media-resizable')) wrapMediaElement(ve);
            });
        }

        // Click handling: select media, Ctrl+click links, deselect on outside click

            var resizable = e.target.closest('.media-resizable');
            // If clicking on a resize handle, don't change selection
            if (e.target.classList.contains('resize-handle')) return;

        // ===== Resize by dragging handles =====
        var resizeState = null;

        function onResizeStart(e) {
            var handle = e.target;
            if (!handle.classList.contains('resize-handle')) return;
            e.preventDefault();
            e.stopPropagation();
            var wrapper = handle.closest('.media-resizable');
            if (!wrapper) return;
            selectMedia(wrapper);
            var rect = wrapper.getBoundingClientRect();
            resizeState = {
                wrapper: wrapper,
                handle: handle.getAttribute('data-handle'),
                startX: e.clientX,
                startY: e.clientY,
                startW: rect.width,
                startH: rect.height,
                aspectRatio: rect.width / rect.height
            };
            document.addEventListener('mousemove', onResizeMove);
            document.addEventListener('mouseup', onResizeEnd);
        }

        function getMaxMediaWidth() {
            var style = window.getComputedStyle(editorEl);
            var padL = parseFloat(style.paddingLeft) || 0;
            var padR = parseFloat(style.paddingRight) || 0;
            return editorEl.clientWidth - padL - padR;
        }

        function onResizeMove(e) {
            if (!resizeState) return;
            var dx = e.clientX - resizeState.startX;
            var newW = resizeState.startW;
            var h = resizeState.handle;
            if (h === 'se' || h === 'ne') newW = resizeState.startW + dx;
            else newW = resizeState.startW - dx;
            var maxW = getMaxMediaWidth();
            newW = Math.max(100, Math.min(newW, maxW));
            resizeState.wrapper.style.width = newW + 'px';
        }

        function onResizeEnd(e) {
            resizeState = null;
            document.removeEventListener('mousemove', onResizeMove);
            document.removeEventListener('mouseup', onResizeEnd);
        }

        editorEl.addEventListener('mousedown', onResizeStart);

        // Touch support for mobile resize
        editorEl.addEventListener('touchstart', function (e) {
            var handle = e.target;
            if (!handle.classList.contains('resize-handle')) return;
            e.preventDefault();
            var touch = e.touches[0];
            var wrapper = handle.closest('.media-resizable');
            if (!wrapper) return;
            selectMedia(wrapper);
            var rect = wrapper.getBoundingClientRect();
            resizeState = {
                wrapper: wrapper,
                handle: handle.getAttribute('data-handle'),
                startX: touch.clientX,
                startY: touch.clientY,
                startW: rect.width,
                startH: rect.height,
                aspectRatio: rect.width / rect.height
            };

            function onTouchMove(ev) {
                if (!resizeState) return;
                var t = ev.touches[0];
                var dx = t.clientX - resizeState.startX;
                var newW = resizeState.startW;
                var h = resizeState.handle;
                if (h === 'se' || h === 'ne') newW = resizeState.startW + dx;
                else newW = resizeState.startW - dx;
                var maxW = getMaxMediaWidth();
                newW = Math.max(100, Math.min(newW, maxW));
                resizeState.wrapper.style.width = newW + 'px';
            }
            function onTouchEnd() {
                resizeState = null;
                document.removeEventListener('touchmove', onTouchMove);
                document.removeEventListener('touchend', onTouchEnd);
            }
            document.addEventListener('touchmove', onTouchMove, { passive: false });
            document.addEventListener('touchend', onTouchEnd);
        }, { passive: false });

            selectedMedia.remove();
            selectedMedia = null;
            updateCharCount();
        });

        // Extend doInsert to handle context menu actions
        var originalDoInsert = doInsert;
        doInsert = function () {
            var url = modalUrlInput.value.trim();
            if (!url) { modalUrlInput.focus(); return; }

            if (insertType === 'changeImageUrl') {
                if (selectedMedia) {
                    var img = selectedMedia.querySelector('img');
                    if (img) img.src = url;
                }
                closeInsertModal();
                insertType = null;
                return;
            }

            if (insertType === 'addImageLink') {
                if (selectedMedia) {
                    var img = selectedMedia.querySelector('img');
                    if (img) {
                        var existingA = img.closest('a');
                        if (existingA) {
                            existingA.href = url;
                        } else {
                            var a = document.createElement('a');
                            a.href = url;
                            a.target = '_blank';
                            a.rel = 'noopener noreferrer';
                            // Move the resizable wrapper inside the link... or link inside wrapper
                            // Wrap img with <a> inside the resizable wrapper
                            img.parentNode.insertBefore(a, img);
                            a.appendChild(img);
                        }
                    }
                }
                closeInsertModal();
                insertType = null;
                return;
            }

            // Default behavior for link/image/video insert
            originalDoInsert();
        };

        // Override the insertBlockAtCursor to auto-wrap new images/videos
        var originalInsertBlock = insertBlockAtCursor;
        insertBlockAtCursor = function (element) {
            // Wrap in resizable before inserting
            var wrapper = document.createElement('div');
            wrapper.className = 'media-resizable';
            wrapper.contentEditable = 'false';
            var maxW = getMaxMediaWidth();
            if (element.tagName === 'IMG') {
                wrapper.style.width = Math.min(400, maxW) + 'px';
            } else {
                wrapper.style.width = Math.min(560, maxW) + 'px';
            }
            wrapper.appendChild(element);
            ['nw','ne','sw','se'].forEach(function (pos) {
                var handle = document.createElement('div');
                handle.className = 'resize-handle resize-handle-' + pos;
                handle.setAttribute('data-handle', pos);
                wrapper.appendChild(handle);
            });
            originalInsertBlock(wrapper);
            selectMedia(wrapper);

            // For images: once loaded, adjust to natural size
            if (element.tagName === 'IMG') {
                element.onload = function () {
                    var maxW = editorEl.clientWidth - 48;
                    var natural = element.naturalWidth || 400;
                    wrapper.style.width = Math.min(natural, maxW) + 'px';
                };
            }
        };

        // Keyboard: Delete/Backspace to remove selected media
        document.addEventListener('keydown', function (e) {
            if (!selectedMedia) return;
            if (e.key === 'Delete' || e.key === 'Backspace') {
                // Don't intercept if focus is in an input/textarea
                if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
                e.preventDefault();
                selectedMedia.remove();
                selectedMedia = null;
                updateCharCount();
            }
        });

        // ===== Style select (H1/H2/H3/P) =====
        document.getElementById('styleSelect').addEventListener('change', function () {
            const tag = this.value;
            if (!tag) return;
            if (guardSpecialBlock('스타일')) {
                this.selectedIndex = 0;
                return;
            }
            try {
                let node = window.getSelection().getRangeAt(0).startContainer;
                if (node.nodeType === 3) node = node.parentNode;
                const t = getClosest(node, ['P', 'H1', 'H2', 'H3', 'DIV', 'LI']);
                if (t) t.removeAttribute('style');
                document.execCommand('formatBlock', false, tag === 'p' ? '<p>' : '<' + tag + '>');
            } catch (e) {
                console.error('Style change failed:', e);
            }
            this.selectedIndex = 0;
            updateFontSizeDisplay();
        });

        // Mobile style buttons
        document.querySelectorAll('[data-mobile-style]').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                const tag = this.getAttribute('data-mobile-style');
                if (guardSpecialBlock('스타일')) return;
                try {
                    document.execCommand('formatBlock', false, tag === 'p' ? '<p>' : '<' + tag + '>');
                } catch (e) {
                    console.error('Mobile style change failed:', e);
                }
            });
        });

        // ===== Font family =====
        function applyFontFamily(family) {
            editorEl.style.fontFamily = "'" + family + "', sans-serif";
            if (fontFamilySelect) fontFamilySelect.value = family;
            // Highlight active mobile font button
            document.querySelectorAll('[data-font]').forEach(function (btn) {
                btn.classList.toggle('active', btn.getAttribute('data-font') === family);
            });
        }

        if (fontFamilySelect) {
            fontFamilySelect.addEventListener('change', function () {
                applyFontFamily(this.value);
                editorEl.focus();
            });
        }

        document.querySelectorAll('[data-font]').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                applyFontFamily(this.getAttribute('data-font'));
            });
        });

        // ===== Indent =====
        function applyIndentToSelection(level) {
            if (guardSpecialBlock('들여쓰기')) return;
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            try {
                let sN = sel.getRangeAt(0).startContainer;
                let eN = sel.getRangeAt(0).endContainer;
                if (sN.nodeType === 3) sN = sN.parentNode;
                if (eN.nodeType === 3) eN = eN.parentNode;
                const elements = new Set();
                function collect(node) {
                    if (!node || node === editorEl) return;
                    if (['P', 'H1', 'H2', 'H3', 'LI', 'DIV'].includes(node.tagName)) elements.add(node);
                    if (node.nodeType === 1) {
                        for (const child of node.children) {
                            if (['P', 'H1', 'H2', 'H3', 'LI', 'DIV'].includes(child.tagName)) elements.add(child);
                        }
                    }
                    collect(node.parentNode);
                }
                collect(sN);
                collect(eN);
                elements.forEach(function (el) {
                    for (let i = 0; i <= 6; i++) el.classList.remove('indent-level-' + i);
                    if (level !== '0' && level) el.classList.add('indent-level-' + level);
                });
            } catch (e) {
                console.error('Indent failed:', e);
            }
        }

        document.getElementById('indentSelect').addEventListener('change', function () {
            if (this.value !== '') {
                applyIndentToSelection(this.value);
                this.selectedIndex = 0;
            }
        });

        document.querySelectorAll('[data-indent]').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                applyIndentToSelection(this.getAttribute('data-indent'));
            });
        });

        // ===== Bottom Sheet =====
        function openBottomSheet() {
            saveSelection();
            bottomSheet.classList.add('open');
            bottomSheetOverlay.classList.add('open');
        }
        function closeBottomSheet() {
            bottomSheet.classList.remove('open');
            bottomSheetOverlay.classList.remove('open');
            editorEl.focus();
            restoreSelection();
        }

        document.getElementById('moreBtn').addEventListener('click', function (e) { e.preventDefault(); openBottomSheet(); });
        document.getElementById('closeBottomSheetBtn').addEventListener('click', function (e) { e.preventDefault(); closeBottomSheet(); });
        bottomSheetOverlay.addEventListener('click', closeBottomSheet);

        // ===== Character & word count =====
        function updateCharCount() {
            let text = '';
            if (currentMode === 'editor') text = editorEl.textContent;
            else if (currentMode === 'html') text = htmlModeEl.value;
            else if (currentMode === 'markdown') text = markdownModeEl.value;

            const withSpaces = text.length;
            const noSpaces = text.replace(/\s/g, '').length;
            const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;

            countWithSpacesEl.textContent = withSpaces.toLocaleString();
            countNoSpacesEl.textContent = noSpaces.toLocaleString();
            countWordsEl.textContent = words.toLocaleString();
        }
        editorEl.addEventListener('input', updateCharCount);
        htmlModeEl.addEventListener('input', updateCharCount);

        // ===== Keyboard shortcuts =====
        editorEl.addEventListener('keydown', function (e) {
            // Enter inside special blocks → line break only
            if (e.key === 'Enter') {
                const sel = window.getSelection();
                if (sel.rangeCount > 0) {
                    let node = sel.anchorNode;
                    const parent = node.nodeType === 3 ? node.parentNode : node;
                    if (getClosest(parent, ['PRE', 'BLOCKQUOTE'])) {
                        e.preventDefault();
                        exec('insertLineBreak');
                    }
                }
                return;
            }
            const ctrl = e.ctrlKey || e.metaKey;
            if (ctrl && e.key.toLowerCase() === 'b') { e.preventDefault(); exec('bold'); }
            if (ctrl && e.key.toLowerCase() === 'i') { e.preventDefault(); exec('italic'); }
            if (ctrl && e.key.toLowerCase() === 'u') { e.preventDefault(); exec('underline'); }
        });

        // ===== Auto-link detection =====
        // When user types a URL and presses Space or Enter, auto-convert to <a>
        editorEl.addEventListener('keydown', function (e) {
            if (e.key !== ' ' && e.key !== 'Enter') return;
            // Don't auto-link inside code blocks
            if (isInsideSpecialBlock() === 'PRE') return;

            var sel = window.getSelection();
            if (!sel.rangeCount || !sel.isCollapsed) return;

            var node = sel.anchorNode;
            if (!node || node.nodeType !== 3) return;
            // Don't re-link if already inside an <a>
            if (getClosest(node.parentNode, ['A'])) return;

            var text = node.textContent;
            var offset = sel.anchorOffset;
            var before = text.substring(0, offset);

            // Find URL at the end of text before cursor
            var urlMatch = before.match(/(https?:\/\/[^\s]+)$/);
            if (!urlMatch) return;

            var url = urlMatch[1];
            var urlStart = urlMatch.index;

            // Create the link element
            var a = document.createElement('a');
            a.href = url;
            a.textContent = url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';

            // Split the text node and replace URL portion
            var afterText = text.substring(offset);
            var beforeText = text.substring(0, urlStart);

            // Build replacement
            node.textContent = beforeText;
            var parent = node.parentNode;
            var refNode = node.nextSibling;
            parent.insertBefore(a, refNode);

            if (afterText) {
                var afterNode = document.createTextNode(afterText);
                parent.insertBefore(afterNode, refNode);
            }

            // Place cursor after the link (the space/enter will be inserted naturally)
            var range = document.createRange();
            if (a.nextSibling) {
                range.setStartBefore(a.nextSibling);
            } else {
                range.setStartAfter(a);
            }
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
        });

        // Also auto-link on paste: if pasted text is a URL, make it a link
        editorEl.addEventListener('paste', function (e) {
            var clipText = (e.clipboardData || window.clipboardData).getData('text/plain').trim();
            if (/^https?:\/\/[^\s]+$/.test(clipText)) {
                // Don't auto-link inside code
                if (isInsideSpecialBlock() === 'PRE') return;
                e.preventDefault();
                var a = document.createElement('a');
                a.href = clipText;
                a.textContent = clipText;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                insertNodeAtCursor(a);
            }
        });

        // ===== Toolbar state =====
        function updateToolbarState() {
            ['bold', 'italic', 'underline', 'insertUnorderedList', 'insertOrderedList'].forEach(function (cmd) {
                try {
                    const btn = document.querySelector('.toolbar-btn[data-format="' + cmd + '"]');
                    if (!btn) return;
                    if (document.queryCommandState(cmd)) btn.classList.add('active');
                    else btn.classList.remove('active');
                } catch (e) { /* ignore */ }
            });
        }

        document.addEventListener('selectionchange', function () {
            updateToolbarState();
            updateFontSizeDisplay();
        });
        editorEl.addEventListener('mouseup', updateToolbarState);

        // ===== Auto-add copy buttons to PRE elements & wrap media =====
        var autoFixTimer = null;
        function autoFixEditorContent() {
            clearTimeout(autoFixTimer);
            autoFixTimer = setTimeout(function () {
                editorEl.querySelectorAll('pre').forEach(addCopyButton);
                ensureMediaWrapped();
            }, 100);
        }
        editorEl.addEventListener('input', autoFixEditorContent);

        // ===== HTML Prettify =====
        function prettifyHTML(html) {
            var voidElements = ['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'];
            var inlineElements = ['a','abbr','b','bdo','cite','code','dfn','em','i','kbd','mark','q','s','samp','small','span','strong','sub','sup','u','var','font','button'];
            var indentStr = '  ';

            var temp = document.createElement('div');
            temp.innerHTML = html;

            // Wrap naked text nodes in <p>
            Array.from(temp.childNodes).forEach(function (node) {
                if (node.nodeType === 3 && node.textContent.trim()) {
                    var p = document.createElement('p');
                    p.textContent = node.textContent;
                    temp.replaceChild(p, node);
                }
            });

            function serializeNode(node, depth) {
                var result = '';
                var pad = indentStr.repeat(depth);

                for (var i = 0; i < node.childNodes.length; i++) {
                    var child = node.childNodes[i];

                    if (child.nodeType === 3) {
                        // Text node
                        var txt = child.textContent;
                        if (txt.trim()) result += pad + txt.trim() + '\n';
                        continue;
                    }
                    if (child.nodeType !== 1) continue;

                    var tag = child.tagName.toLowerCase();
                    var isVoid = voidElements.indexOf(tag) !== -1;
                    var isInline = inlineElements.indexOf(tag) !== -1;

                    // Build opening tag with attributes
                    var openTag = '<' + tag;
                    for (var a = 0; a < child.attributes.length; a++) {
                        var attr = child.attributes[a];
                        openTag += ' ' + attr.name + '="' + attr.value.replace(/"/g, '&quot;') + '"';
                    }

                    if (isVoid) {
                        result += pad + openTag + '>\n';
                    } else if (isInline || (!child.children.length && child.textContent.length < 80)) {
                        // Inline or short content → single line
                        result += pad + openTag + '>' + child.innerHTML.trim() + '</' + tag + '>\n';
                    } else {
                        // Block element → indent children
                        result += pad + openTag + '>\n';
                        result += serializeNode(child, depth + 1);
                        result += pad + '</' + tag + '>\n';
                    }
                }
                return result;
            }

            return serializeNode(temp, 0).trim();
        }

        // ===== HTML → Markdown conversion =====
        function htmlToMarkdown(html) {
            const temp = document.createElement('div');
            temp.innerHTML = html;
            return nodeToMarkdown(temp).trim().replace(/\n{3,}/g, '\n\n');
        }

        function nodeToMarkdown(node) {
            let md = '';
            node.childNodes.forEach(function (child) {
                if (child.nodeType === 3) {
                    md += child.textContent;
                    return;
                }
                if (child.nodeType !== 1) return;

                const tag = child.tagName;
                const inner = nodeToMarkdown(child);

                switch (tag) {
                    case 'H1': md += '\n# ' + inner.trim() + '\n\n'; break;
                    case 'H2': md += '\n## ' + inner.trim() + '\n\n'; break;
                    case 'H3': md += '\n### ' + inner.trim() + '\n\n'; break;
                    case 'P':
                    case 'DIV':
                        if (child.classList && child.classList.contains('video-embed')) {
                            var vIframe = child.querySelector('iframe');
                            if (vIframe) md += '\n[Embedded Video](' + (vIframe.getAttribute('src') || '') + ')\n\n';
                        } else {
                            md += inner.trim() + '\n\n';
                        }
                        break;
                    case 'BR': md += '\n'; break;
                    case 'STRONG':
                    case 'B': md += '**' + inner + '**'; break;
                    case 'EM':
                    case 'I': md += '*' + inner + '*'; break;
                    case 'U': md += '<u>' + inner + '</u>'; break;
                    case 'BLOCKQUOTE':
                        md += '\n' + inner.trim().split('\n').map(function (l) { return '> ' + l; }).join('\n') + '\n\n';
                        break;
                    case 'PRE':
                        // Remove copy button text from code
                        let code = child.textContent;
                        const copyBtn = child.querySelector('.copy-code-btn');
                        if (copyBtn) code = code.replace(copyBtn.textContent, '').trim();
                        md += '\n```\n' + code + '\n```\n\n';
                        break;
                    case 'UL':
                        child.querySelectorAll(':scope > li').forEach(function (li) {
                            md += '- ' + nodeToMarkdown(li).trim() + '\n';
                        });
                        md += '\n';
                        break;
                    case 'OL':
                        var idx = 1;
                        child.querySelectorAll(':scope > li').forEach(function (li) {
                            md += idx + '. ' + nodeToMarkdown(li).trim() + '\n';
                            idx++;
                        });
                        md += '\n';
                        break;
                    case 'LI': md += inner; break;
                    case 'A':
                        var href = child.getAttribute('href') || '';
                        md += '[' + inner + '](' + href + ')';
                        break;
                    case 'IMG':
                        var src = child.getAttribute('src') || '';
                        var alt = child.getAttribute('alt') || '';
                        md += '![' + alt + '](' + src + ')';
                        break;
                    case 'IFRAME':
                        var iframeSrc = child.getAttribute('src') || '';
                        md += '\n[Embedded Video](' + iframeSrc + ')\n';
                        break;
                    case 'SPAN':
                    case 'FONT': md += inner; break;
                    case 'BUTTON': break; // skip copy buttons
                    default: md += inner; break;
                }
            });
            return md;
        }

        // ===== Mode switching =====
        // Snapshot of editor HTML taken when LEAVING editor mode
        var editorSnapshot = '';

        // Strip editor-only elements (resize handles, copy buttons, wrappers) for clean output
        function getCleanHTML() {
            var clone = editorEl.cloneNode(true);

            // Unwrap .media-resizable: replace wrapper with its content (img or .video-embed)
            clone.querySelectorAll('.media-resizable').forEach(function (wrapper) {
                // Preserve the width as inline style on the inner media element
                var w = wrapper.style.width;
                var inner = wrapper.querySelector('img, .video-embed');
                if (inner) {
                    if (w) inner.style.width = w;
                    inner.style.maxWidth = '100%';
                    wrapper.parentNode.insertBefore(inner, wrapper);
                }
                wrapper.remove();
            });

            // Remove resize handles (in case any orphaned)
            clone.querySelectorAll('.resize-handle').forEach(function (h) { h.remove(); });

            // Remove copy buttons from code blocks
            clone.querySelectorAll('.copy-code-btn').forEach(function (b) { b.remove(); });

            // Remove contenteditable attributes from inner elements
            clone.querySelectorAll('[contenteditable]').forEach(function (el) {
                el.removeAttribute('contenteditable');
            });

            return clone.innerHTML;
        }

        function switchMode(mode) {
            // ---- Leaving current mode ----
            if (currentMode === 'editor' && mode !== 'editor') {
                // Save a clean snapshot for output, and raw for restoration
                editorSnapshot = editorEl.innerHTML;
            }

            // ---- Entering new mode ----
            if (mode === 'html') {
                htmlModeEl.value = prettifyHTML(getCleanHTML());
            } else if (mode === 'markdown') {
                markdownModeEl.value = htmlToMarkdown(getCleanHTML());
            } else if (mode === 'editor') {
                if (currentMode === 'html') {
                    // User may have edited HTML — apply it back
                    editorEl.innerHTML = htmlModeEl.value;
                } else {
                    // Coming from markdown (read-only) — restore original snapshot
                    if (editorSnapshot) {
                        editorEl.innerHTML = editorSnapshot;
                    }
                }
                // Re-add copy buttons and media wrappers
                editorEl.querySelectorAll('pre').forEach(addCopyButton);
                ensureMediaWrapped();
                editorSnapshot = '';
            }

            editorEl.style.display = mode === 'editor' ? 'block' : 'none';
            htmlModeEl.style.display = mode === 'html' ? 'block' : 'none';
            markdownModeEl.style.display = mode === 'markdown' ? 'block' : 'none';

            document.querySelectorAll('.mode-tab').forEach(function (t) { t.classList.remove('active'); });
            document.querySelector('.mode-tab[data-mode="' + mode + '"]').classList.add('active');

            modeLabelEl.textContent = modeLabels[mode];
            currentMode = mode;
            updateCharCount();

            if (mode === 'editor') editorEl.focus();
            else if (mode === 'html') htmlModeEl.focus();
        }

        document.querySelectorAll('.mode-tab').forEach(function (tab) {
            tab.addEventListener('click', function (e) {
                e.preventDefault();
                switchMode(this.getAttribute('data-mode'));
            });
        });

        // ===== Init =====
        editorEl.focus();
        updateCharCount();
    })();
    </script>
</body>
</html>
